[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reporeaver"
version = "0.2.0"
description = "Pre-clone repo security scanner. Catches obfuscated payloads in SVGs, unicode tricks, C2 callbacks, supply-chain attacks, and CI/CD abuse."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["security", "supply-chain", "malware", "svg", "ci-cd", "devsecops"]
authors = [
    {name = "srinathsankara"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/srinathsankara/reporeaver"

[project.scripts]
reporeaver = "reporeaver.cli:main"

[tool.setuptools.packages.find]
include = ["reporeaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
