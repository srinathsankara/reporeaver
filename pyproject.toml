[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reporeaver"
version = "0.2.0"
description = "Pre-clone repo security scanner — detects obfuscated payloads in SVGs, Unicode tricks, C2 callbacks, supply-chain attacks, and CI/CD abuse."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["security", "supply-chain", "malware", "svg", "ci-cd", "devsecops"]
authors = [
    {name = "srinathsankara"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pyyaml>=5.0",
]

[project.urls]
Repository = "https://github.com/srinathsankara/reporeaver"

[project.scripts]
reporeaver = "reporeaver.cli:main"

[project.optional-dependencies]
dashboard = ["fastapi>=0.100", "uvicorn>=0.20", "jinja2>=3.0"]
all = ["fastapi>=0.100", "uvicorn>=0.20", "jinja2>=3.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["reporeaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
