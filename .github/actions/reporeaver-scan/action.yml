name: "RepoReaver Security Gate"
description: "Scan repositories for obfuscated payloads, hidden scripts, C2 callbacks, and supply-chain attacks"
author: "reporeaver"

branding:
  icon: "shield"
  color: "red"

inputs:
  target:
    description: "Path to scan (repository root by default)"
    required: false
    default: "."
  version:
    description: "Version of reporeaver to install (e.g., '0.2.0' or 'latest')"
    required: false
    default: "latest"
  severity-threshold:
    description: "Fail CI if findings at or above this level (critical, high, medium, low)"
    required: false
    default: "high"
  output-sarif:
    description: "Path to write SARIF output (for GitHub Security tab)"
    required: false
    default: "reporeaver-results.sarif"
  output-html:
    description: "Path to write HTML dashboard"
    required: false
    default: "reporeaver-report.html"
  output-json:
    description: "Path to write JSON report"
    required: false
    default: "reporeaver-report.json"
  policy:
    description: "Path to custom policy YAML file"
    required: false
    default: ""
  skip-analyzers:
    description: "Comma-separated analyzer names to skip"
    required: false
    default: ""
  verbose:
    description: "Include medium-severity findings"
    required: false
    default: "false"
  diff-only:
    description: "Only scan files changed vs origin/main"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for Checks API integration (default: ${{ github.token }})"
    required: false
    default: ""

outputs:
  risk-score:
    description: "Aggregate risk score (0-10)"
    value: ${{ steps.scan.outputs.risk_score }}
  critical-count:
    description: "Number of critical findings"
    value: ${{ steps.scan.outputs.critical_count }}
  exit-code:
    description: "Exit code (0 = pass, 1 = fail)"
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: "Install RepoReaver"
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          pip install reporeaver 2>/dev/null || pip install -e ${{ github.action_path }}/../../.. 2>/dev/null || { echo "Failed to install reporeaver"; exit 1; }
        else
          pip install reporeaver==${{ inputs.version }} 2>/dev/null || { echo "Failed to install reporeaver v${{ inputs.version }}"; exit 1; }
        fi
        # Verify installation
        reporeaver --help >/dev/null 2>&1 || { echo "reporeaver not found after install"; exit 1; }

    - name: "Run RepoReaver"
      id: scan
      shell: bash
      run: |
        ARGS="scan '${{ inputs.target }}'"
        ARGS="$ARGS --sarif '${{ inputs.output-sarif }}'"
        ARGS="$ARGS --html '${{ inputs.output-html }}'"
        ARGS="$ARGS --output '${{ inputs.output-json }}'"
        ARGS="$ARGS --max-size 5"

        if [ "${{ inputs.verbose }}" = "true" ]; then
          ARGS="$ARGS --verbose"
        fi
        if [ "${{ inputs.diff-only }}" = "true" ]; then
          ARGS="$ARGS --diff-only"
        fi
        if [ -n "${{ inputs.policy }}" ]; then
          ARGS="$ARGS --policy '${{ inputs.policy }}'"
        fi
        if [ -n "${{ inputs.skip-analyzers }}" ]; then
          ARGS="$ARGS --skip '${{ inputs.skip-analyzers }}'"
        fi

        reporeaver $ARGS
        exit_code=$?

        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        echo "risk_score=$(jq -r '.risk_score.score // "0"' ${{ inputs.output-json }} 2>/dev/null || echo '0')" >> $GITHUB_OUTPUT
        echo "critical_count=$(jq -r '.risk_score.critical // "0"' ${{ inputs.output-json }} 2>/dev/null || echo '0')" >> $GITHUB_OUTPUT

        # Check against threshold
        threshold="${{ inputs.severity-threshold }}"
        max_sev=$(jq -r '.risk_score.max_severity // "info"' ${{ inputs.output-json }} 2>/dev/null || echo 'info')

        declare -A levels=( ["critical"]=4 ["high"]=3 ["medium"]=2 ["low"]=1 ["info"]=0 )
        if [ "${levels[$max_sev]}" -ge "${levels[$threshold]}" ]; then
          echo "Threshold '$threshold' exceeded (max severity: $max_sev)"
          exit $exit_code
        fi

    - name: "Post GitHub Check Run"
      if: ${{ always() && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        SCORE=$(jq -r '.risk_score.score // "0"' ${{ inputs.output-json }} 2>/dev/null || echo "0")
        CRIT=$(jq -r '.risk_score.critical // "0"' ${{ inputs.output-json }} 2>/dev/null || echo "0")
        HIGH=$(jq -r '.risk_score.high // "0"' ${{ inputs.output-json }} 2>/dev/null || echo "0")
        TOTAL=$(jq -r '.risk_score.total // "0"' ${{ inputs.output-json }} 2>/dev/null || echo "0")
        CONCLUSION="success"
        [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 3 ] && CONCLUSION="failure"

        gh api repos/${{ github.repository }}/check-runs \
          -f name="RepoReaver Security Gate" \
          -f head_sha="${{ github.sha }}" \
          -f status="completed" \
          -f conclusion="$CONCLUSION" \
          -f output[title]="RepoReaver: Score $SCORE/10" \
          -f output[summary]="**Results**
- Risk Score: **$SCORE/10**
- Critical: **$CRIT**
- High: **$HIGH**
- Total: **$TOTAL**
" || true

    - name: "Upload SARIF to GitHub Security"
      if: ${{ always() && inputs.output-sarif != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output-sarif }}
        category: reporeaver

    - name: "Upload HTML Dashboard"
      if: ${{ always() && inputs.output-html != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: reporeaver-report
        path: |
          ${{ inputs.output-html }}
          ${{ inputs.output-json }}
          ${{ inputs.output-sarif }}
